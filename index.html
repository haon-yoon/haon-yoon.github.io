<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오니의 스마트 케어 포털</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      margin: 0;
      padding: 24px 16px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .portal-container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* 헤더 */
    .portal-header {
      margin-bottom: 28px;
    }
    .portal-icon {
      font-size: 46px;
      margin-bottom: 10px;
      display: inline-block;
    }
    .portal-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    .portal-header p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    /* 모드 선택 카드 목록 */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }
    .mode-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 20px 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
      position: relative;
    }
    .mode-card:active {
      transform: scale(0.98);
      background-color: #f1f5f9;
    }
    .mode-card.shared {
      border-color: #bfdbfe;
      background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);
    }

    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .icon-shared { background: #dbeafe; }
    .icon-local { background: #f1f5f9; }

    .mode-info { flex: 1; }
    .mode-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .badge-cloud { background: #dcfce7; color: #15803d; }
    .badge-device { background: #e2e8f0; color: #475569; }

    .mode-title {
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 3px;
    }
    .mode-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin: 0;
    }
    .arrow-icon {
      color: #94a3b8;
      font-size: 18px;
      font-weight: 700;
    }

    /* 하단 안내 */
    .portal-footer {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="portal-container">
  
  <div class="portal-header">
    <div class="portal-icon">🍼</div>
    <h1>오니의 스마트 케어</h1>
    <p>상비약 용량 계산 · 교차복용 타이머 · 키즈노트<br>접속할 모드를 선택해 주세요.</p>
  </div>

  <div class="mode-list">
    <!-- 1. 가족 실시간 공유 모드 -->
    <a href="./share.html" class="mode-card shared">
      <div class="icon-box icon-shared">👨‍👩‍👧</div>
      <div class="mode-info">
        <span class="mode-badge badge-cloud">클라우드 실시간 동기화</span>
        <div class="mode-title">가족 실시간 공유용</div>
        <p class="mode-desc">엄마·아빠 폰끼리 투약 기록과 타이머가 즉시 공유되어 오투약을 방지합니다.</p>
      </div>
      <div class="arrow-icon">➔</div>
    </a>

    <!-- 2. 내 폰 전용 로컬 모드 -->
    <a href="./local.html" class="mode-card">
      <div class="icon-box icon-local">📱</div>
      <div class="mode-info">
        <span class="mode-badge badge-device">내 기기 단독 저장</span>
        <div class="mode-title">개인 전용 모드</div>
        <p class="mode-desc">외부 서버 없이 현재 스마트폰 브라우저에만 기록을 안전하게 보관합니다.</p>
      </div>
      <div class="arrow-icon">➔</div>
    </a>
  </div>

  <div class="portal-footer">
    자주 사용하는 모드는 해당 페이지 진입 후<br>
    브라우저 메뉴에서 <strong>'홈 화면에 추가'</strong>를 해두시면 편합니다.
  </div>

</div>

</body>
</html>
