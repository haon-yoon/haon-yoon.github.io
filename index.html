<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오니의 종합 상비약 & 투약 가이드</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); margin: 0; padding: 16px 12px 60px; color: var(--text-main); display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; }

    /* 헤더 */
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { font-size: 21px; font-weight: 800; margin: 0 0 6px; color: #1e293b; letter-spacing: -0.5px; }
    .header p { font-size: 13px; color: var(--text-muted); margin: 0; }

    /* 체중 컨트롤러 */
    .weight-card {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 20px;
      padding: 16px 18px;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
      margin-bottom: 14px;
    }
    .weight-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .weight-title { font-size: 14px; font-weight: 600; opacity: 0.95; }
    .weight-display { display: flex; align-items: baseline; }
    .weight-input {
      width: 90px;
      background: rgba(255, 255, 255, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-align: right;
      padding: 4px 8px;
      outline: none;
    }
    .weight-input:focus { background: rgba(255, 255, 255, 0.3); border-color: #fff; }
    .weight-unit { font-size: 16px; font-weight: 700; margin-left: 6px; }
    
    .btn-group { display: flex; gap: 6px; }
    .btn-step {
      flex: 1;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      color: #ffffff;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-step:active { background: rgba(255, 255, 255, 0.35); }

    /* 검색창 */
    .search-box { margin-bottom: 12px; position: relative; }
    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px 11px 38px;
      font-size: 14px;
      outline: none;
      color: var(--text-main);
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #94a3b8; }

    /* 탭 메뉴 */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      white-space: nowrap;
      border: none;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab-btn.active {
      background: #1e293b;
      color: #ffffff;
      border-color: #1e293b;
    }

    /* 카드 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .card-name { font-size: 15px; font-weight: 800; color: #1e293b; }
    .card-tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; margin-left: 6px; }
    
    .tag-red { background: #fee2e2; color: #dc2626; }
    .tag-blue { background: #e0f2fe; color: #0284c7; }
    .tag-yellow { background: #fef9c3; color: #a16207; }
    .tag-green { background: #dcfce7; color: #16a34a; }
    .tag-purple { background: #f3e8ff; color: #9333ea; }
    .tag-gray { background: #f1f5f9; color: #475569; }

    .card-symptom { font-size: 12px; color: #475569; margin-bottom: 8px; font-weight: 500; }
    
    .dose-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .dose-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 4px; }
    .dose-row:last-child { margin-bottom: 0; }
    .dose-label { color: #64748b; }
    .dose-value { font-weight: 800; color: #0f172a; }
    .dose-value.highlight { color: #2563eb; font-size: 14px; }

    .card-info { font-size: 11.5px; color: #64748b; line-height: 1.45; background: #fff; border-top: 1px dashed var(--border); padding-top: 8px; }
    .card-info strong { color: #334155; }

    /* 주의 수칙 */
    .emergency-box {
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 14px;
      padding: 14px;
      margin-top: 20px;
      font-size: 12px;
      color: #742a2a;
      line-height: 1.6;
    }
    .emergency-box h4 { margin: 0 0 6px; font-size: 13px; color: #9b2c2c; }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="header">
    <h1>🍼 오니의 종합 상비약 & 가이드</h1>
    <p>체중 기반 자동 계산 및 필수 상비약 백과</p>
  </div>

  <!-- 체중 컨트롤러 -->
  <div class="weight-card">
    <div class="weight-top">
      <span class="weight-title">아기 현재 체중 설정</span>
      <div class="weight-display">
        <input type="number" id="babyWeight" class="weight-input" value="10.0" step="0.1" inputmode="decimal">
        <span class="weight-unit">kg</span>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn-step" onclick="changeWeight(-0.5)">- 0.5kg</button>
      <button class="btn-step" onclick="changeWeight(-0.1)">- 0.1kg</button>
      <button class="btn-step" onclick="changeWeight(0.1)">+ 0.1kg</button>
      <button class="btn-step" onclick="changeWeight(0.5)">+ 0.5kg</button>
    </div>
  </div>

  <!-- 검색창 -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="약 이름, 성분, 증상 검색 (예: 기침, 상처, 설사)">
  </div>

  <!-- 카테고리 탭 (5대 카테고리 확장) -->
  <div class="tabs">
    <button class="tab-btn active" onclick="filterTab('all', this)">전체보기</button>
    <button class="tab-btn" onclick="filterTab('fever', this)">1. 해열·진통</button>
    <button class="tab-btn" onclick="filterTab('resp', this)">2. 호흡기·감기</button>
    <button class="tab-btn" onclick="filterTab('gut', this)">3. 소화기·장염</button>
    <button class="tab-btn" onclick="filterTab('skin', this)">4. 피부·연고</button>
    <button class="tab-btn" onclick="filterTab('wound', this)">5. 외상·안과·응급</button>
  </div>

  <div id="medicineList">
    <!-- 동적 렌더링 -->
  </div>

  <!-- 응급 안내 카드 -->
  <div class="emergency-box">
    <h4>🚨 교차 복용 및 필수 응급 원칙</h4>
    • <strong>교차 복용 규칙:</strong> [아세트아미노펜] ↔ [덱시부/이부프로펜]은 열이 안 떨어질 때만 <strong>최소 2시간</strong> 간격을 둡니다.<br>
    • <strong>동일 성분 재투약:</strong> 같은 약은 <strong>최소 4~6시간</strong> 간격을 반드시 엄수해야 합니다.<br>
    • <strong>즉시 진료 신호:</strong> 39°C 이상 고열 24시간 지속, 8시간 이상 기저귀 마름(탈수), 눈 풀림 또는 전신 경련 시 즉시 응급실로 내원하세요.
  </div>

</div>

      staticDose: '1일 2~3회 상처 부위 소량 도포',
      interval: '상처 세척 후 건조 상태에서 도포',
      note: '세균 감염 예방 및 덧남 방지용 필수 항생제'
    },
    {
      cat: 'skin',
      name: '가려움 / 벌레물림 외용액',
      products: '버물리 키즈, 칼라민 로션',
      tagClass: 'tag-yellow',
      symptom: '모기/벌레 물림, 팽진 가려움 진정',
      staticDose: '환부에 수시로 가볍게 펴 바름',
      interval: '가려워 긁으려 할 때마다 도포',
      note: '에탄올/멘톨이 없는 순한 저자극 유아 전용 제품 사용'
    },
    {
      cat: 'skin',
      name: '경구 항히스타민 시럽',
      products: '두드리진, 페니라민, 유시락스 (처방용)',
      tagClass: 'tag-purple',
      symptom: '전신 급성 두드러기, 음식 알레르기 가려움',
      calcSingle: (w) => (w * 0.2).toFixed(1) + ' ~ ' + (w * 0.25).toFixed(1) + ' ml (의사 처방 기준 준수)',
      interval: '1일 2~3회',
      note: '호흡 곤란이나 입술 부종(아나필락시스) 동반 시 약 먹이지 말고 즉시 응급실 직행'
    },

    // 5. 외상 · 안과 · 응급처치
    {
      cat: 'wound',
      name: '저자극 무알코올 소독액',
      products: '애니클렌액, 솔트액, 세네풀',
      tagClass: 'tag-blue',
      symptom: '찰과상, 넘어짐, 긁힌 상처 1차 소독',
      staticDose: '상처 부위에 칙칙 뿌리거나 거즈에 적셔 닦아냄',
      interval: '상처 발생 즉시',
      note: '에탄올/과산화수소수는 피부 손상과 극심한 통증을 유발하므로 절대 사용 금지'
    },
    {
      cat: 'wound',
      name: '하이드로콜로이드 씬 밴드',
      products: '듀오덤 엑스트라씬, 메디폼 H',
      tagClass: 'tag-green',
      symptom: '진물 나는 찰과상, 긁힘 흉터 예방',
      staticDose: '상처 크기보다 1~2cm 크게 잘라 밀착 부착',
      interval: '하얗게 부풀어 올라 진물이 샐 때까지 2~3일 유지',
      note: '연고를 바르지 않고 소독 후 완전히 말린 맨 피부에 붙여야 잘 밀착됨'
    },
    {
      cat: 'wound',
      name: '1회용 무방부제 인공눈물',
      products: '0.9% 염화나트륨 1회용 앰플',
      tagClass: 'tag-blue',
      symptom: '눈에 모래/먼지/비누 들어갔을 때, 눈곱 세척',
      staticDose: '눈꺼풀을 살짝 벌려 눈 안쪽에서 바깥쪽으로 씻어냄',
      interval: '이물질 접촉 즉시',
      note: '방부제 없는 1회용 앰플로 구비, 개봉 후 남은 액은 즉시 폐기'
    }
  ];

  let currentCategory = 'all';
  const weightInput = document.getElementById('babyWeight');
  const searchInput = document.getElementById('searchInput');
  const listContainer = document.getElementById('medicineList');

  function changeWeight(delta) {
    let current = parseFloat(weightInput.value) || 10.0;
    current = Math.max(2.0, Math.min(30.0, current + delta));
    weightInput.value = current.toFixed(1);
    render();
  }

  function filterTab(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function render() {
    const weight = parseFloat(weightInput.value) || 10.0;
    const query = searchInput.value.trim().toLowerCase();

    let filtered = meds.filter(m => {
      const matchCat = (currentCategory === 'all' || m.cat === currentCategory);
      const matchText = (m.name + m.products + m.symptom + (m.note || '')).toLowerCase().includes(query);
      return matchCat && matchText;
    });

    if (filtered.length === 0) {
      listContainer.innerHTML = '<div style="text-align:center; padding:40px 0; color:#94a3b8; font-size:14px;">검색 결과가 없습니다.</div>';
      return;
    }

    let html = '';
    filtered.forEach(m => {
      html += `
        <div class="card">
          <div class="card-head">
            <div>
              <span class="card-name">${m.name}</span>
              <span class="card-tag ${m.tagClass}">${m.products}</span>
            </div>
          </div>
          <div class="card-symptom">📍 <strong>적응증:</strong> ${m.symptom}</div>
          <div class="dose-box">
            ${m.calcSingle ? `
              <div class="dose-row">
                <span class="dose-label">1회 권장량:</span>
                <span class="dose-value highlight">${m.calcSingle(weight)}</span>
              </div>
            ` : ''}
            ${m.calcMax ? `
              <div class="dose-row">
                <span class="dose-label">1일 최대 한도:</span>
                <span class="dose-value">${m.calcMax(weight)}</span>
              </div>
            ` : ''}
            ${m.staticDose ? `
              <div class="dose-row">
                <span class="dose-label">용법/용량:</span>
                <span class="dose-value highlight">${m.staticDose}</span>
              </div>
            ` : ''}
            <div class="dose-row" style="margin-top:4px;">
              <span class="dose-label">투약/사용 간격:</span>
              <span class="dose-value" style="font-weight:600; font-size:12px;">${m.interval}</span>
            </div>
          </div>
          <div class="card-info">
            💡 <strong>관리 및 비고:</strong> ${m.note}
          </div>
        </div>
      `;
    });

    listContainer.innerHTML = html;
  }

  weightInput.addEventListener('input', render);
  searchInput.addEventListener('input', render);

  // 첫 실행
  render();
</script>

</body>
</html>
