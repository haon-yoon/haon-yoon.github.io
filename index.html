<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PWA 홈화면 전체화면 앱 세팅 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1e293b">
  
  <title>오니의 스마트 케어 포털</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      margin: 0;
      padding: 24px 16px 40px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .portal-container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* 헤더 */
    .portal-header {
      margin-bottom: 24px;
    }
    .portal-icon {
      font-size: 44px;
      margin-bottom: 8px;
      display: inline-block;
    }
    .portal-header h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    .portal-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    /* 모드 선택 카드 목록 */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .mode-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 16px 16px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }
    .mode-card:active {
      transform: scale(0.98);
      background-color: #f1f5f9;
    }
    
    /* 카드 테마 */
    .mode-card.shared {
      border-color: #bfdbfe;
      background: linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
    }
    .mode-card.local {
      border-color: #e2e8f0;
      background: #ffffff;
    }
    .mode-card.emergency {
      border-color: #fecaca;
      background: linear-gradient(180deg, #ffffff 0%, #fff1f2 100%);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .icon-shared { background: #dbeafe; }
    .icon-local { background: #f1f5f9; }
    .icon-emergency { background: #fee2e2; }

    .mode-info { flex: 1; }
    .mode-badge {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .badge-cloud { background: #dcfce7; color: #15803d; }
    .badge-device { background: #e2e8f0; color: #475569; }
    .badge-danger { background: #fee2e2; color: #b91c1c; }

    .mode-title {
      font-size: 15.5px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 2px;
    }
    .mode-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
      margin: 0;
    }
    .arrow-icon {
      color: #94a3b8;
      font-size: 16px;
      font-weight: 700;
    }

    .portal-footer {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="portal-container">
  
  <div class="portal-header">
    <div class="portal-icon">🍼</div>
    <h1>하온 스마트 케어</h1>
    <p>상비약 용량 계산 · 교차복용 타이머 · 키즈노트<br>이용하실 모드를 선택해 주세요.</p>
  </div>

  <div class="mode-list">
    <!-- 1. 가족 실시간 클라우드 모드 (Y1.html로 올바르게 연결) -->
    <a href="./Y1.html" class="mode-card shared">
      <div class="icon-box icon-shared">👨‍👩‍👧</div>
      <div class="mode-info">
        <span class="mode-badge badge-cloud">실시간 동기화</span>
        <div class="mode-title">실시간 전용 모드</div>
        <p class="mode-desc">투약 기록과 체중이 실시간 공유됩니다.</p>
      </div>
      <div class="arrow-icon">➔</div>
    </a>

    <!-- 2. 내 폰 전용 로컬 모드 (Y2.html로 올바르게 연결) -->
    <a href="./Y2.html" class="mode-card local">
      <div class="icon-box icon-local">📱</div>
      <div class="mode-info">
        <span class="mode-badge badge-device">단독 저장용</span>
        <div class="mode-title">개인 전용 모드</div>
        <p class="mode-desc">내 스마트폰에만 안전하고 빠르게 기록합니다.</p>
      </div>
      <div class="arrow-icon">➔</div>
    </a>

    <!-- 3. 심야 응급 / 달빛어린이병원 안내 카드 (기존 스타일 활용) -->
    <a href="./Y1.html#emergency" class="mode-card emergency">
      <div class="icon-box icon-emergency">🚨</div>
      <div class="mode-info">
        <span class="mode-badge badge-danger">긴급 안내</span>
        <div class="mode-title">야간 소아과 & 응급 핫라인</div>
        <p class="mode-desc">119/1339 직통 전화 및 내 주변 달빛어린이병원 지도 바로가기</p>
      </div>
      <div class="arrow-icon">➔</div>
    </a>
  </div>

  <div class="portal-footer">
    자주 쓰는 모드로 접속 후 브라우저 메뉴에서<br>
    <strong>'홈 화면에 추가'</strong>를 해두시면 앱처럼 전체 화면으로 열립니다.
  </div>

</div>

</body>
</html>
